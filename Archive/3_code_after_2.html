<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Campus Dashboard</title>

<!-- Tailwind CSS (Play CDN) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          canvas:  '#0A0B0F', // Seitenhintergrund
          surface: '#13151B', // Karten
          surface2:'#191C24', // Eingaben / Hover-Flächen
          line:    '#242833', // Rahmen
          ink:     '#EDEBE8', // Haupttext
          muted:   '#98A0AC', // Sekundärtext
          flame:   '#F2A93B', // Signaturfarbe: "live" / Primäraktionen
          signal:  '#4CC9DE', // Vorlesung / Links
          alert:   '#F2556B', // Klausur / Löschen
          ok:      '#3ED598', // Status "Ja" / Erfolg
        },
        fontFamily: {
          display: ['"Space Grotesk"', 'sans-serif'],
          body: ['"Inter"', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'monospace'],
        },
        boxShadow: {
          card: '0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.55)',
        },
      },
    },
  };
</script>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Icons -->
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

<!-- Supabase JS SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  html { scroll-behavior: smooth; }
  section[id] { scroll-margin-top: 5.5rem; }
  body { font-feature-settings: "ss01"; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #242833; border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: #323847; }

  /* Native Datum/Zeit-Picker-Icons für Dark Mode aufhellen */
  input[type="date"]::-webkit-calendar-picker-indicator,
  input[type="time"]::-webkit-calendar-picker-indicator {
    filter: invert(0.75);
    cursor: pointer;
  }

  .nav-link {
    display: flex; align-items: center; gap: .6rem;
    padding: .6rem .75rem; border-radius: .65rem;
    font-size: .875rem; color: #98A0AC;
    transition: background-color .15s ease, color .15s ease;
  }
  .nav-link:hover, .nav-link.nav-active { background: #191C24; color: #EDEBE8; }
</style>
</head>

<body class="bg-canvas text-ink font-body antialiased">

  <!-- ============================================================
       MOBILE TOP BAR (nur < md)
  ============================================================= -->
  <header class="md:hidden sticky top-0 z-30 flex items-center justify-between bg-surface/95 backdrop-blur border-b border-line px-4 py-3">

      <div class="h-8 w-8 rounded-lg bg-flame/15 flex items-center justify-center">
        <i data-lucide="graduation-cap" class="h-4 w-4 text-flame"></i>
      </div>
      <span class="font-display font-semibold text-sm text-ink" id="mobileTitle">Campus Dashboard</span>
    </div>
    <button id="mobileMenuBtn" class="p-2 rounded-lg hover:bg-surface2 text-ink transition" aria-label="Menü öffnen">
      <i data-lucide="menu" class="h-5 w-5"></i>
    </button>
  </header>

  <!-- Mobiles Ausklapp-Menü (Burger-Menü) -->
  <nav id="mobileMenu" class="hidden md:hidden bg-surface border-b border-line px-4 py-3 space-y-1 sticky top-[57px] z-30">

  </nav>

  <!-- ============================================================
       DESKTOP SIDEBAR (>= md)
  ============================================================= -->

    <div class="flex items-center gap-2.5 px-2 mb-8">
      <div class="h-9 w-9 rounded-lg bg-flame/15 flex items-center justify-center shrink-0">
        <i data-lucide="graduation-cap" class="h-5 w-5 text-flame"></i>

      <div class="leading-tight">

    <nav class="flex-1 space-y-1">
      <a href="#overview" data-section="overview" class="nav-link"><i data-lucide="layout-dashboard" class="h-4 w-4"></i>Übersicht</a>
      <a href="#schedule" data-section="schedule" class="nav-link"><i data-lucide="calendar-days" class="h-4 w-4"></i>Stundenplan</a>

  <!-- ============================================================
       HAUPTINHALT
  ============================================================= -->
  <main class="md:ml-64 px-4 sm:px-6 md:px-10 py-8 md:py-12 max-w-5xl mx-auto space-y-16">

    <!-- ---------- A) ÜBERSICHT ---------- -->
    <section id="overview">
      <div class="flex items-center justify-between mb-6">
        <div>
          <h2 class="font-display text-2xl text-ink font-semibold flex items-center gap-2">
            <i data-lucide="layout-dashboard" class="h-5 w-5 text-flame"></i>
            Übersicht

        <span id="demoBadge" class="hidden sm:inline-flex text-[10px] uppercase tracking-wide text-muted border border-line rounded-full px-2.5 py-1">Demo-Daten</span>

      <!-- Live / Als Nächstes (Signatur-Element) -->

          <span class="relative flex h-2.5 w-2.5">

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

          <h3 class="font-display text-base text-ink font-semibold flex items-center gap-2">
            <i data-lucide="alarm-clock" class="h-4 w-4 text-alert"></i>
            Klausuren-Countdown

        <!-- To-Do -->
        <div class="rounded-2xl bg-surface border border-line shadow-card p-6">

    <!-- ---------- B) STUNDENPLAN ---------- -->
    <section id="schedule">
      <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
        <h2 class="font-display text-2xl text-ink font-semibold flex items-center gap-2">
          <i data-lucide="calendar-days" class="h-5 w-5 text-flame"></i>
          Stundenplan
        </h2>
        <div class="flex items-center gap-3">
          <div class="flex items-center gap-1 rounded-lg border border-line bg-surface p-1">
            <button id="prevWeekBtn" class="p-1.5 rounded-md hover:bg-surface2 text-muted hover:text-ink transition" aria-label="Vorherige Woche">
              <i data-lucide="chevron-left" class="h-4 w-4"></i>
            </button>

          <button id="addEntryBtn" class="hidden items-center gap-1.5 rounded-lg bg-flame text-canvas text-sm font-medium px-3 py-2 hover:bg-flame/90 transition">

          </button>
        </div>
      </div>
      <div id="scheduleGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4"></div>

    <!-- ---------- C) DOZENTEN & KONTAKTE ---------- -->
    <section id="lecturers">
      <h2 class="font-display text-2xl text-ink font-semibold flex items-center gap-2 mb-6">
        <i data-lucide="users" class="h-5 w-5 text-flame"></i>
        Dozenten & Kontakte
      </h2>
      <div id="lecturersGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </section>

  </main>

  <!-- ============================================================
       MODAL: Kurs hinzufügen / bearbeiten (nur Admin)
  ============================================================= -->
  <div id="scheduleModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
    <div class="w-full max-w-md rounded-2xl bg-surface border border-line shadow-card p-6">
      <div class="flex items-center justify-between mb-5">
        <h3 id="scheduleModalTitle" class="font-display text-lg text-ink font-semibold">Kurs hinzufügen</h3>
        <button id="scheduleModalClose" class="text-muted hover:text-ink transition" aria-label="Schließen">
          <i data-lucide="x" class="h-5 w-5"></i>
        </button>
      </div>
      <form id="scheduleForm" class="space-y-4">
        <input type="hidden" id="entryId">
        <div>
          <label class="block text-xs text-muted mb-1">Datum</label>
          <input required type="date" id="entryDate" class="w-full rounded-lg bg-surface2 border border-line px-3 py-2 text-sm text-ink focus:outline-none focus:ring-2 focus:ring-flame/50">

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-muted mb-1">Start</label>
            <input required type="time" id="entryStart" class="w-full rounded-lg bg-surface2 border border-line px-3 py-2 text-sm text-ink focus:outline-none focus:ring-2 focus:ring-flame/50">
          </div>
          <div>
            <label class="block text-xs text-muted mb-1">Ende</label>
            <input required type="time" id="entryEnd" class="w-full rounded-lg bg-surface2 border border-line px-3 py-2 text-sm text-ink focus:outline-none focus:ring-2 focus:ring-flame/50">
          </div>
        </div>
        <div>
          <label class="block text-xs text-muted mb-1">Kursname</label>
          <input required type="text" id="entryName" placeholder="z. B. Softwareentwicklung II" class="w-full rounded-lg bg-surface2 border border-line px-3 py-2 text-sm text-ink placeholder:text-muted/60 focus:outline-none focus:ring-2 focus:ring-flame/50">
        </div>

          <div>

            <input required type="text" id="entryRoom" placeholder="A1.12" class="w-full rounded-lg bg-surface2 border border-line px-3 py-2 text-sm text-ink placeholder:text-muted/60 focus:outline-none focus:ring-2 focus:ring-flame/50">
          </div>
          <div>
            <label class="block text-xs text-muted mb-1">Typ</label>
            <select id="entryType" class="w-full rounded-lg bg-surface2 border border-line px-3 py-2 text-sm text-ink focus:outline-none focus:ring-2 focus:ring-flame/50">
              <option value="lecture">Vorlesung</option>
              <option value="exam">Klausur</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-xs text-muted mb-1">Dozent (optional)</label>
          <input type="text" id="entryLecturer" class="w-full rounded-lg bg-surface2 border border-line px-3 py-2 text-sm text-ink focus:outline-none focus:ring-2 focus:ring-flame/50">
        </div>
        <button type="submit" class="w-full rounded-lg bg-flame text-canvas font-medium text-sm py-2.5 hover:bg-flame/90 transition">Speichern</button>
      </form>
    </div>
  </div>

  <script>
  /* ================================================================
     KONFIGURATION — hier Kursname etc. anpassen
  ================================================================= */
  const CONFIG = {
    dashboardTitle: 'Campus Dashboard',
    courseName: 'TINF23 B3', // TODO: eigenen Kurs eintragen
  };

  /* ================================================================
     SUPABASE — Zugangsdaten & Tabellen
     ----------------------------------------------------------------
     Sobald ein Supabase-Projekt existiert, hier URL + Key eintragen.
     Bis dahin läuft das Dashboard automatisch mit Demo-Daten weiter
     (siehe generateDemoSchedule() / generateDemoLecturers() unten).

     Erwartete Tabellen in Supabase:

     1) "schedule"
        - id           uuid / int8  (Primary Key)
        - date         date         z. B. 2026-08-05
        - start_time   text/time    z. B. "09:00"
        - end_time     text/time    z. B. "10:30"
        - course_name  text
        - room         text
        - type         text         "lecture" | "exam"
        - lecturer     text         optional

     2) "lecturers"
        - id                  uuid / int8  (Primary Key)
        - name                text
        - email               text
        - office_hours        text   ("Sprechzeiten")
        - room                text
        - appointment_booked  bool   ("Sprechstunde gebucht?")
  ================================================================= */
  const SUPABASE_URL = 'DEINE_SUPABASE_URL';           // z. B. 'https://xxxx.supabase.co'
  const SUPABASE_ANON_KEY = 'DEIN_SUPABASE_ANON_KEY';

  const SUPABASE_TABLE_SCHEDULE = 'schedule';
  const SUPABASE_TABLE_LECTURERS = 'lecturers';

  const isSupabaseConfigured =
    SUPABASE_URL.startsWith('https://') && SUPABASE_ANON_KEY.length > 20;

  const supabaseClient = isSupabaseConfigured
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    : null;

  /* ================================================================
     ADMIN-PASSWORT (nur clientseitig — siehe Hinweis im Chat!)
  ================================================================= */
  const ADMIN_PASSWORD = 'admin';

  /* ================================================================
     DATUMS-HILFSFUNKTIONEN (immer lokale Zeit, kein UTC-Versatz)
  ================================================================= */
  function isoDate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }
  function parseIsoDateLocal(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    return new Date(y, m - 1, d);
  }
  function addDays(date, days) {
    const d = new Date(date);
    d.setDate(d.getDate() + days);
    return d;
  }
  function getMonday(date) {
    const d = new Date(date);
    const day = d.getDay(); // 0 = Sonntag
    const diff = (day === 0 ? -6 : 1) - day;
    d.setDate(d.getDate() + diff);
    d.setHours(0, 0, 0, 0);
    return d;
  }
  function formatDateDe(iso) {
    return parseIsoDateLocal(iso).toLocaleDateString('de-DE', {
      weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric',
    });
  }
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = String(str ?? '');
    return div.innerHTML;
  }

  const WEEKDAYS = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag'];

  /* ================================================================
     DEMO-DATEN (werden nur genutzt, solange Supabase nicht konfiguriert ist)
     Termine werden relativ zur aktuellen Woche erzeugt, damit die
     "Live"-Anzeige und der Klausuren-Countdown beim Testen sinnvoll aussehen.
  ================================================================= */
  function examEntry(date, start, end, name, room, lecturer) {
    return {
      id: crypto.randomUUID(), date: isoDate(date),
      start_time: start, end_time: end,
      course_name: name, room, type: 'exam', lecturer,
    };
  }

  function generateDemoSchedule() {
    const monday = getMonday(new Date());
    const entries = [];
    const push = (dayOffset, start, end, name, room, type, lecturer) => {
      entries.push({
        id: crypto.randomUUID(),
        date: isoDate(addDays(monday, dayOffset)),
        start_time: start, end_time: end,
        course_name: name, room, type, lecturer: lecturer || null,
      });
    };
    // Diese Woche (Mo–Fr)
    push(0, '09:00', '10:30', 'Softwareentwicklung II', 'A1.12', 'lecture', 'Prof. Dr. Keller');
    push(0, '10:45', '12:15', 'Mathematik III', 'A1.05', 'lecture', 'Prof. Dr. Vogt');
    push(1, '08:00', '09:30', 'Datenbanksysteme', 'B2.03', 'lecture', 'Prof. Dr. Nauer');
    push(1, '13:00', '14:30', 'BWL Grundlagen', 'A2.01', 'lecture', 'Prof. Dr. Brandt');
    push(2, '09:00', '12:00', 'Programmierpraktikum Java', 'PC-Pool 1', 'lecture', 'M. Schuster');
    push(2, '13:15', '14:45', 'Softwareentwicklung II', 'A1.12', 'lecture', 'Prof. Dr. Keller');
    push(3, '10:45', '12:15', 'Rechnernetze', 'B1.10', 'lecture', 'Prof. Dr. Nauer');
    push(4, '09:00', '10:30', 'Wirtschaftsenglisch', 'A1.08', 'lecture', 'C. Fields');
    // Klausuren in den nächsten Wochen (für den Countdown)
    entries.push(examEntry(addDays(monday, 16), '09:00', '10:30', 'Klausur Datenbanksysteme', 'Aula', 'Prof. Dr. Nauer'));
    entries.push(examEntry(addDays(monday, 23), '11:00', '13:00', 'Klausur Mathematik III', 'Aula', 'Prof. Dr. Vogt'));
    return entries;
  }

  function generateDemoLecturers() {
    return [
      { id: crypto.randomUUID(), name: 'Prof. Dr. Nauer', email: 'nauer@dhbw-example.de', office_hours: 'Mi 14:00–15:00 Uhr', room: 'B2.14', appointment_booked: false },
      { id: crypto.randomUUID(), name: 'Prof. Dr. Vogt', email: 'vogt@dhbw-example.de', office_hours: 'Do 10:00–11:00 Uhr', room: 'A1.09', appointment_booked: true },
      { id: crypto.randomUUID(), name: 'Prof. Dr. Keller', email: 'keller@dhbw-example.de', office_hours: 'Di 13:00–14:00 Uhr', room: 'A1.20', appointment_booked: false },
      { id: crypto.randomUUID(), name: 'Prof. Dr. Brandt', email: 'brandt@dhbw-example.de', office_hours: 'nach Vereinbarung', room: 'A2.05', appointment_booked: true },
      { id: crypto.randomUUID(), name: 'M. Schuster', email: 'schuster@dhbw-example.de', office_hours: 'Fr 09:00–10:00 Uhr', room: 'PC-Pool 1', appointment_booked: false },
    ];
  }

  /* ================================================================
     GLOBALER ZUSTAND
  ================================================================= */
  const TODO_STORAGE_KEY = 'dhbw_dashboard_todos';

  function loadTodosFromStorage() {
    try {
      const raw = localStorage.getItem(TODO_STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch {
      return [];
    }
  }
  function saveTodosToStorage() {
    localStorage.setItem(TODO_STORAGE_KEY, JSON.stringify(state.todos));
  }

  const state = {
    isAdmin: false,
    weekOffset: 0,
    schedule: generateDemoSchedule(),
    lecturers: generateDemoLecturers(),
    todos: loadTodosFromStorage(),
  };

  /* ================================================================
     SUPABASE-ZUGRIFFSFUNKTIONEN
     (fallen automatisch auf die lokalen Demo-Daten zurück, solange
      SUPABASE_URL / SUPABASE_ANON_KEY nicht gesetzt sind)
  ================================================================= */
  async function loadSchedule() {
    if (supabaseClient) {
      const { data, error } = await supabaseClient
        .from(SUPABASE_TABLE_SCHEDULE).select('*').order('date', { ascending: true });
      if (error) { console.error(error); return state.schedule; }
      return data;
    }
    return state.schedule;
  }
  async function loadLecturers() {
    if (supabaseClient) {
      const { data, error } = await supabaseClient
        .from(SUPABASE_TABLE_LECTURERS).select('*').order('name', { ascending: true });
      if (error) { console.error(error); return state.lecturers; }
      return data;
    }
    return state.lecturers;
  }
  async function refreshSchedule() {
    state.schedule = await loadSchedule();
    renderAll();
  }
  async function addScheduleEntry(entry) {
    if (supabaseClient) {
      const { error } = await supabaseClient.from(SUPABASE_TABLE_SCHEDULE).insert(entry);
      if (error) return alert('Fehler beim Speichern: ' + error.message);
    } else {
      entry.id = crypto.randomUUID();
      state.schedule.push(entry);
    }
    await refreshSchedule();
  }
  async function updateScheduleEntry(id, changes) {
    if (supabaseClient) {
      const { error } = await supabaseClient.from(SUPABASE_TABLE_SCHEDULE).update(changes).eq('id', id);
      if (error) return alert('Fehler beim Aktualisieren: ' + error.message);
    } else {
      const idx = state.schedule.findIndex(x => x.id === id);
      if (idx > -1) state.schedule[idx] = { ...state.schedule[idx], ...changes };
    }
    await refreshSchedule();
  }
  async function deleteScheduleEntry(id) {
    if (supabaseClient) {
      const { error } = await supabaseClient.from(SUPABASE_TABLE_SCHEDULE).delete().eq('id', id);
      if (error) return alert('Fehler beim Löschen: ' + error.message);
    } else {
      state.schedule = state.schedule.filter(x => x.id !== id);
    }
    await refreshSchedule();
  }
  async function updateLecturerStatus(id, value) {
    if (supabaseClient) {
      const { error } = await supabaseClient.from(SUPABASE_TABLE_LECTURERS).update({ appointment_booked: value }).eq('id', id);
      if (error) return alert('Fehler beim Aktualisieren: ' + error.message);
      state.lecturers = await loadLecturers();
    } else {
      const idx = state.lecturers.findIndex(x => x.id === id);
      if (idx > -1) state.lecturers[idx].appointment_booked = value;
    }
    renderLecturers();
    lucide.createIcons();
  }

  /* ================================================================
     RENDER: Live / Als Nächstes
  ================================================================= */
  function toMinutes(t) {
    const [h, m] = t.split(':').map(Number);
    return h * 60 + m;
  }

  function renderLiveCard() {
    const now = new Date();
    const todayIso = isoDate(now);
    const nowMinutes = now.getHours() * 60 + now.getMinutes();

    const todaysEntries = state.schedule
      .filter(e => e.date === todayIso)
      .sort((a, b) => a.start_time.localeCompare(b.start_time));

    const current = todaysEntries.find(e => nowMinutes >= toMinutes(e.start_time) && nowMinutes < toMinutes(e.end_time));
    const next = todaysEntries.find(e => toMinutes(e.start_time) > nowMinutes);

    const label = document.getElementById('liveLabel');
    const content = document.getElementById('liveContent');

    if (current) {
      const total = toMinutes(current.end_time) - toMinutes(current.start_time);
      const progress = Math.min(100, Math.max(0, Math.round(((nowMinutes - toMinutes(current.start_time)) / total) * 100)));
      label.textContent = 'Läuft gerade';
      content.innerHTML = `
        <h3 class="font-display text-2xl md:text-3xl text-ink font-semibold mb-3">${escapeHtml(current.course_name)}</h3>
        <div class="flex flex-wrap items-center gap-x-5 gap-y-2 text-sm text-muted mb-5">
          <span class="flex items-center gap-1.5"><i data-lucide="clock" class="h-4 w-4"></i>${current.start_time} – ${current.end_time} Uhr</span>
          <span class="flex items-center gap-1.5"><i data-lucide="map-pin" class="h-4 w-4"></i>${escapeHtml(current.room)}</span>
          ${current.lecturer ? `<span class="flex items-center gap-1.5"><i data-lucide="user" class="h-4 w-4"></i>${escapeHtml(current.lecturer)}</span>` : ''}
        </div>
        <div class="h-1.5 w-full rounded-full bg-surface2 overflow-hidden">
          <div class="h-full rounded-full bg-flame transition-all duration-500" style="width:${progress}%"></div>
        </div>
        <p class="mt-2 text-xs font-mono text-muted">endet um ${current.end_time} Uhr</p>`;
    } else if (next) {
      const diff = toMinutes(next.start_time) - nowMinutes;
      const hrs = Math.floor(diff / 60), mins = diff % 60;
      label.textContent = 'Als Nächstes';
      content.innerHTML = `
        <h3 class="font-display text-2xl md:text-3xl text-ink font-semibold mb-3">${escapeHtml(next.course_name)}</h3>
        <div class="flex flex-wrap items-center gap-x-5 gap-y-2 text-sm text-muted">
          <span class="flex items-center gap-1.5"><i data-lucide="clock" class="h-4 w-4"></i>${next.start_time} – ${next.end_time} Uhr</span>
          <span class="flex items-center gap-1.5"><i data-lucide="map-pin" class="h-4 w-4"></i>${escapeHtml(next.room)}</span>
        </div>
        <p class="mt-4 font-mono text-sm text-flame">in ${hrs > 0 ? hrs + ' Std ' : ''}${mins} Min</p>`;
    } else {
      label.textContent = 'Pause';
      content.innerHTML = `
        <h3 class="font-display text-2xl md:text-3xl text-ink font-semibold mb-2">Heute keine weiteren Termine</h3>
        <p class="text-sm text-muted">Genieß die freie Zeit ☕</p>`;
    }
    lucide.createIcons();
  }

  /* ================================================================
     RENDER: Klausuren-Countdown
  ================================================================= */
  function renderExamCountdown() {
    const container = document.getElementById('examList');
    const todayIso = isoDate(new Date());

    const exams = state.schedule
      .filter(e => e.type === 'exam' || /klausur/i.test(e.course_name))
      .filter(e => e.date >= todayIso)
      .sort((a, b) => a.date.localeCompare(b.date));

    if (exams.length === 0) {
      container.innerHTML = `<p class="text-sm text-muted">Aktuell keine anstehenden Klausuren.</p>`;
      return;
    }

    container.innerHTML = exams.map(e => {
      const days = Math.round((parseIsoDateLocal(e.date) - parseIsoDateLocal(todayIso)) / 86400000);
      const daysLabel = days === 0 ? 'heute' : days === 1 ? 'morgen' : `in ${days} Tagen`;
      return `
        <div class="flex items-center justify-between rounded-xl border border-line bg-surface2/60 px-4 py-3">
          <div>
            <p class="text-sm text-ink font-medium">${escapeHtml(e.course_name)}</p>
            <p class="text-xs text-muted font-mono">${formatDateDe(e.date)}</p>
          </div>
          <span class="shrink-0 rounded-full bg-alert/15 text-alert text-xs font-mono px-3 py-1">${daysLabel}</span>
        </div>`;
    }).join('');
  }

  /* ================================================================
     RENDER: To-Do-Liste (localStorage)
  ================================================================= */
  function renderTodos() {
    const list = document.getElementById('todoList');
    if (state.todos.length === 0) {
      list.innerHTML = `<p class="text-sm text-muted py-2">Noch keine Einträge – leg direkt los.</p>`;
      return;
    }
    list.innerHTML = state.todos.map(t => `
      <li class="flex items-center gap-3 group">
        <button data-todo-toggle="${t.id}" class="shrink-0 h-5 w-5 rounded-md border flex items-center justify-center transition ${t.done ? 'bg-ok border-ok' : 'border-line'}">
          ${t.done ? '<i data-lucide="check" class="h-3.5 w-3.5 text-canvas"></i>' : ''}
        </button>
        <span class="flex-1 text-sm ${t.done ? 'text-muted line-through' : 'text-ink'}">${escapeHtml(t.text)}</span>
        <button data-todo-delete="${t.id}" class="opacity-0 group-hover:opacity-100 text-muted hover:text-alert transition" aria-label="Löschen">
          <i data-lucide="x" class="h-4 w-4"></i>
        </button>
      </li>`).join('');
  }

  document.getElementById('todoForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const input = document.getElementById('todoInput');
    const text = input.value.trim();
    if (!text) return;
    state.todos.push({ id: crypto.randomUUID(), text, done: false });
    saveTodosToStorage();
    input.value = '';
    renderTodos();
    lucide.createIcons();
  });

  document.getElementById('todoList').addEventListener('click', (e) => {
    const toggleBtn = e.target.closest('[data-todo-toggle]');
    const deleteBtn = e.target.closest('[data-todo-delete]');
    if (toggleBtn) {
      const todo = state.todos.find(t => t.id === toggleBtn.dataset.todoToggle);
      if (todo) todo.done = !todo.done;
      saveTodosToStorage();
      renderTodos();
      lucide.createIcons();
    }
    if (deleteBtn) {
      state.todos = state.todos.filter(t => t.id !== deleteBtn.dataset.todoDelete);
      saveTodosToStorage();
      renderTodos();
      lucide.createIcons();
    }
  });

  /* ================================================================
     RENDER: Stundenplan (Wochenkalender)
  ================================================================= */
  function scheduleCardHtml(e) {
    const isExam = e.type === 'exam';
    const accentClass = isExam ? 'border-l-alert' : 'border-l-signal';
    return `
      <div class="group relative rounded-xl border border-line border-l-4 ${accentClass} bg-surface p-3 shadow-card">
        <p class="text-xs font-mono text-muted">${e.start_time} – ${e.end_time}</p>
        <p class="text-sm font-medium text-ink mt-0.5">${escapeHtml(e.course_name)}</p>
        <p class="text-xs text-muted mt-1 flex items-center gap-1"><i data-lucide="map-pin" class="h-3 w-3"></i>${escapeHtml(e.room)}</p>
        ${state.isAdmin ? `
          <div class="absolute top-2 right-2 hidden group-hover:flex gap-1">
            <button data-edit-entry="${e.id}" class="p-1 rounded-md bg-surface2 hover:bg-line text-muted hover:text-ink transition"><i data-lucide="pencil" class="h-3 w-3"></i></button>
            <button data-delete-entry="${e.id}" class="p-1 rounded-md bg-surface2 hover:bg-line text-muted hover:text-alert transition"><i data-lucide="trash-2" class="h-3 w-3"></i></button>
          </div>` : ''}
      </div>`;
  }

  function renderScheduleGrid() {
    const monday = addDays(getMonday(new Date()), state.weekOffset * 7);
    const days = [0, 1, 2, 3, 4].map(i => addDays(monday, i));
    const todayIso = isoDate(new Date());

    document.getElementById('weekRangeLabel').textContent =
      `${days[0].toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' })} – ${days[4].toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' })}`;

    const grid = document.getElementById('scheduleGrid');
    grid.innerHTML = days.map((day, idx) => {
      const dayIso = isoDate(day);
      const isToday = dayIso === todayIso;
      const dayEntries = state.schedule
        .filter(e => e.date === dayIso)
        .sort((a, b) => a.start_time.localeCompare(b.start_time));

      return `
        <div class="flex flex-col gap-3">
          <div class="flex items-baseline justify-between px-1">
            <p class="text-sm font-medium ${isToday ? 'text-flame' : 'text-ink'}">${WEEKDAYS[idx]}</p>
            <p class="text-xs font-mono ${isToday ? 'text-flame' : 'text-muted'}">${day.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' })}</p>
          </div>
          <div class="space-y-2 min-h-[2rem]">
            ${dayEntries.length ? dayEntries.map(scheduleCardHtml).join('') : `<p class="text-xs text-muted px-1">–</p>`}
          </div>
        </div>`;
    }).join('');
  }

  document.getElementById('prevWeekBtn').addEventListener('click', () => { state.weekOffset--; renderScheduleGrid(); lucide.createIcons(); });
  document.getElementById('nextWeekBtn').addEventListener('click', () => { state.weekOffset++; renderScheduleGrid(); lucide.createIcons(); });

  // Klick-Delegation für dynamisch erzeugte Bearbeiten-/Löschen-Buttons
  document.getElementById('scheduleGrid').addEventListener('click', (e) => {
    const editBtn = e.target.closest('[data-edit-entry]');
    const delBtn = e.target.closest('[data-delete-entry]');
    if (editBtn) {
      const entry = state.schedule.find(x => x.id === editBtn.dataset.editEntry);
      if (entry) openScheduleModal(entry);
    }
    if (delBtn) {
      if (confirm('Diesen Termin wirklich löschen?')) deleteScheduleEntry(delBtn.dataset.deleteEntry);
    }
  });

  /* ---------------- Admin-Modal: Kurs hinzufügen / bearbeiten ---------------- */
  const scheduleModal = document.getElementById('scheduleModal');

  function openScheduleModal(entry = null) {
    document.getElementById('scheduleModalTitle').textContent = entry ? 'Kurs bearbeiten' : 'Kurs hinzufügen';
    document.getElementById('entryId').value = entry ? entry.id : '';
    document.getElementById('entryDate').value = entry ? entry.date : isoDate(new Date());
    document.getElementById('entryStart').value = entry ? entry.start_time : '';
    document.getElementById('entryEnd').value = entry ? entry.end_time : '';
    document.getElementById('entryName').value = entry ? entry.course_name : '';
    document.getElementById('entryRoom').value = entry ? entry.room : '';
    document.getElementById('entryType').value = entry ? entry.type : 'lecture';
    document.getElementById('entryLecturer').value = entry && entry.lecturer ? entry.lecturer : '';
    scheduleModal.classList.remove('hidden');
  }
  function closeScheduleModal() { scheduleModal.classList.add('hidden'); }

  document.getElementById('addEntryBtn').addEventListener('click', () => openScheduleModal());
  document.getElementById('scheduleModalClose').addEventListener('click', closeScheduleModal);
  scheduleModal.addEventListener('click', (e) => { if (e.target === scheduleModal) closeScheduleModal(); });

  document.getElementById('scheduleForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('entryId').value;
    const entry = {
      date: document.getElementById('entryDate').value,
      start_time: document.getElementById('entryStart').value,
      end_time: document.getElementById('entryEnd').value,
      course_name: document.getElementById('entryName').value.trim(),
      room: document.getElementById('entryRoom').value.trim(),
      type: document.getElementById('entryType').value,
      lecturer: document.getElementById('entryLecturer').value.trim() || null,
    };
    if (id) await updateScheduleEntry(id, entry);
    else await addScheduleEntry(entry);
    closeScheduleModal();
  });

  /* ================================================================
     RENDER: Dozenten & Kontakte
  ================================================================= */
  function initials(name) {
    const clean = name.replace(/Prof\.|Dr\./g, '').trim();
    const parts = clean.split(/\s+/).filter(Boolean);
    return parts.slice(0, 2).map(w => w[0]).join('').toUpperCase();
  }

  function renderLecturers() {
    const grid = document.getElementById('lecturersGrid');
    grid.innerHTML = state.lecturers.map(l => `
      <div class="rounded-2xl border border-line bg-surface p-5 shadow-card flex flex-col gap-4">
        <div class="flex items-center gap-3">
          <div class="h-11 w-11 rounded-full bg-signal/15 flex items-center justify-center font-display text-signal font-semibold shrink-0">
            ${initials(l.name)}
          </div>
          <div>
            <p class="text-sm font-medium text-ink">${escapeHtml(l.name)}</p>
            <p class="text-xs text-muted flex items-center gap-1"><i data-lucide="map-pin" class="h-3 w-3"></i>${escapeHtml(l.room)}</p>
          </div>
        </div>
        <p class="text-xs text-muted flex items-center gap-1.5"><i data-lucide="clock" class="h-3.5 w-3.5"></i>${escapeHtml(l.office_hours)}</p>
        <a href="mailto:${encodeURIComponent(l.email)}" class="inline-flex items-center gap-1.5 text-xs text-signal hover:text-ink transition self-start">
          <i data-lucide="mail" class="h-3.5 w-3.5"></i>${escapeHtml(l.email)}
        </a>
        <div class="flex items-center justify-between pt-3 border-t border-line">
          <span class="text-xs text-muted">Sprechstunde gebucht?</span>
          ${state.isAdmin ? `
            <button data-toggle-lecturer="${l.id}" class="relative h-6 w-11 rounded-full transition ${l.appointment_booked ? 'bg-ok' : 'bg-surface2 border border-line'}">
              <span class="absolute top-0.5 h-5 w-5 rounded-full bg-white transition-all ${l.appointment_booked ? 'left-[22px]' : 'left-0.5'}"></span>
            </button>` : `
            <span class="text-xs font-mono px-2.5 py-1 rounded-full ${l.appointment_booked ? 'bg-ok/15 text-ok' : 'bg-surface2 text-muted'}">
              ${l.appointment_booked ? 'Ja' : 'Nein'}
            </span>`}
        </div>
      </div>`).join('');
  }

  document.getElementById('lecturersGrid').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-toggle-lecturer]');
    if (!btn) return;
    const lecturer = state.lecturers.find(x => x.id === btn.dataset.toggleLecturer);
    if (lecturer) updateLecturerStatus(lecturer.id, !lecturer.appointment_booked);
  });

  /* ================================================================
     ADMIN-ZUGANG
  ================================================================= */
  function handleAdminToggle() {
    if (state.isAdmin) {
      state.isAdmin = false;
    } else {
      const pw = prompt('Admin-Passwort eingeben:');
      if (pw === null) return;
      if (pw !== ADMIN_PASSWORD) { alert('Falsches Passwort.'); return; }
      state.isAdmin = true;
    }
    updateAdminUI();
    renderAll();
  }
  document.getElementById('adminToggleBtn').addEventListener('click', handleAdminToggle);
  document.getElementById('adminToggleBtnMobile').addEventListener('click', handleAdminToggle);

  function updateAdminUI() {
    const badge = document.getElementById('adminStatusBadge');
    badge.classList.toggle('hidden', !state.isAdmin);
    badge.classList.toggle('flex', state.isAdmin);

    const label = state.isAdmin ? 'Abmelden' : 'Admin-Zugang';
    document.getElementById('adminBtnLabel').textContent = label;
    document.getElementById('adminBtnLabelMobile').textContent = label;

    const addBtn = document.getElementById('addEntryBtn');
    addBtn.classList.toggle('hidden', !state.isAdmin);
    addBtn.classList.toggle('inline-flex', state.isAdmin);
  }

  /* ================================================================
     NAVIGATION: Scroll-Sync & mobiles Menü
  ================================================================= */
  const navLinks = document.querySelectorAll('[data-section]');
  navLinks.forEach(link => {
    link.addEventListener('click', (e) => {
      e.preventDefault();
      document.getElementById(link.dataset.section).scrollIntoView({ behavior: 'smooth', block: 'start' });
      closeMobileMenu();
    });
  });

  const sections = document.querySelectorAll('main section[id]');
  const sectionObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        navLinks.forEach(l => l.classList.toggle('nav-active', l.dataset.section === entry.target.id));
      }
    });
  }, { rootMargin: '-40% 0px -55% 0px' });
  sections.forEach(s => sectionObserver.observe(s));

  const mobileMenu = document.getElementById('mobileMenu');
  document.getElementById('mobileMenuBtn').addEventListener('click', () => mobileMenu.classList.toggle('hidden'));
  function closeMobileMenu() { mobileMenu.classList.add('hidden'); }

  /* ================================================================
     GESAMT-RENDER & INITIALISIERUNG
  ================================================================= */
  function renderAll() {
    renderLiveCard();
    renderExamCountdown();
    renderScheduleGrid();
    renderLecturers();
    renderTodos();
    lucide.createIcons();
  }

  async function init() {
    document.title = `${CONFIG.dashboardTitle} · ${CONFIG.courseName}`;
    document.getElementById('sidebarTitle').textContent = CONFIG.dashboardTitle;
    document.getElementById('mobileTitle').textContent = CONFIG.dashboardTitle;
    document.getElementById('sidebarCourse').textContent = CONFIG.courseName;
    document.getElementById('todayLabel').textContent =
      new Date().toLocaleDateString('de-DE', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
    document.getElementById('demoBadge').classList.toggle('hidden', isSupabaseConfigured);

    if (supabaseClient) {
      state.schedule = await loadSchedule();
      state.lecturers = await loadLecturers();
    }

    updateAdminUI();
    renderAll();
    setInterval(renderLiveCard, 30000); // Live-Karte alle 30s aktualisieren
  }

  document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
